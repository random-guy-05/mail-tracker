<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --violet: #6d4aff; --violet-bg: #f0ebff; --violet-ring: #ddd2ff;
    --green: #0f8a4b; --green-bg: #e3f6ec; --green-ring: #c4ebd5;
    --gray: #5f6368; --gray-bg: #f4f5f7; --gray-ring: #e1e3e6;
    --text: #1f1f1f; --muted: #6b7076; --line: #eef0f2; --bg: #fff; --card: #f8f9fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --violet: #a993ff; --violet-bg: #2a2342; --violet-ring: #3d3360;
      --green: #5fd49a; --green-bg: #173326; --green-ring: #22493a;
      --gray: #aab0b6; --gray-bg: #26282b; --gray-ring: #34373b;
      --text: #ececec; --muted: #9aa0a6; --line: #2a2c2f; --bg: #18191b; --card: #212326;
    }
  }
  * { box-sizing: border-box; }
  body { width: 400px; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 "Google Sans", Roboto, system-ui, sans-serif; }
  svg { width: 14px; height: 14px; fill: currentColor; flex: none; }

  header { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff;
          background: linear-gradient(135deg, #8b6cff, #5b34f5); box-shadow: 0 4px 12px -4px rgba(109, 74, 255, .6); }
  .logo svg { width: 17px; height: 17px; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
  .icon-btn { width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .icon-btn:hover { background: var(--gray-bg); color: var(--text); }
  .icon-btn svg { width: 18px; height: 18px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px; }
  .stat { padding: 12px; border-radius: 14px; background: var(--card); }
  .stat .v { font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .l { margin-top: 2px; font-size: 11.5px; color: var(--muted); }
  .stat.open .v { color: var(--violet); } .stat.click .v { color: var(--green); }
  .bar { height: 4px; margin-top: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: currentColor; width: 0; transition: width .5s ease; }
  .stat.open .bar { color: var(--violet); } .stat.click .bar { color: var(--green); }

  .tabs { display: flex; gap: 4px; margin: 14px 16px 6px; padding: 3px; border-radius: 10px; background: var(--gray-bg); }
  .tabs button { flex: 1; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: inherit; font-weight: 500; cursor: pointer; }
  .tabs button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }

  ul { list-style: none; margin: 0; padding: 4px 8px 10px; max-height: 360px; overflow-y: auto; }
  li { display: flex; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 12px; cursor: pointer; }
  li:hover { background: var(--card); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: #fff; }
  .main { flex: 1; min-width: 0; }
  .subj { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px 0 6px; border-radius: 999px; font-size: 11px; font-weight: 500;
          background: var(--bg-c); color: var(--fg-c); box-shadow: inset 0 0 0 1px var(--ring-c); white-space: nowrap; }
  .chip svg { width: 12px; height: 12px; }
  .chip.unopened { --bg-c: var(--gray-bg); --fg-c: var(--gray); --ring-c: var(--gray-ring); }
  .chip.opened { --bg-c: var(--violet-bg); --fg-c: var(--violet); --ring-c: var(--violet-ring); }
  .chip.clicks { --bg-c: var(--green-bg); --fg-c: var(--green); --ring-c: var(--green-ring); }
  .when { font-size: 11px; color: var(--muted); }

  .empty { padding: 36px 24px 40px; text-align: center; color: var(--muted); }
  .empty .big { width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 16px; display: grid; place-items: center; background: var(--violet-bg); color: var(--violet); }
  .empty .big svg { width: 26px; height: 26px; }
  .empty strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 4px; }
  .err { margin: 8px 16px 0; padding: 8px 12px; border-radius: 10px; background: #fdecea; color: #b3261e; font-size: 12px; }
  .skeleton { height: 54px; margin: 4px 8px; border-radius: 12px; background: linear-gradient(90deg, var(--card), var(--gray-bg), var(--card)); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
</style>
</head>
<body>
  <header>
    <div class="logo" id="logo"></div>
    <h1>Mail Tracker</h1>
    <button class="icon-btn" id="settings" title="Settings"></button>
  </header>
  <div class="stats">
    <div class="stat"><div class="v" id="s-sent">–</div><div class="l">Tracked</div></div>
    <div class="stat open"><div class="v" id="s-open">–</div><div class="l">Open rate</div><div class="bar"><i id="b-open"></i></div></div>
    <div class="stat click"><div class="v" id="s-click">–</div><div class="l">Click rate</div><div class="bar"><i id="b-click"></i></div></div>
  </div>
  <div id="error" class="err" hidden></div>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">All</button>
    <button data-f="opened">Opened</button>
    <button data-f="unopened">Unopened</button>
    <button data-f="clicks">Clicked</button>
  </div>
  <ul id="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></ul>
  <script src="popup.js"></script>
</body>
</html>
